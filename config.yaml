# Top-level environment
env: ${env}        # dev | staging | prod

# Paths and directories
paths:
  raw_dir: ${RAW_DATA_DIR}
  processed_dir: ${PROCESSED_DATA_DIR}
  external_dir: ${EXTERNAL_DATA_DIR}
  feature_store: ${PROCESSED_DATA_DIR}/feature_store
  

# File structure (relative to raw/processed roots)
raw_subdirs:
  players:  
    players_basic: players/players_basic.csv
    players_detailed: players/players_detailed.csv

  teams:
    teams_basic: teams/teams_basic.csv
    teams_detailed: teams/teams_detailed.csv

  awards:
    mvp: awards/mvp.csv
    roty: awards/roty.csv
    dpoy: awards/dpoy.csv
    6oty: awards/6oty.csv
    mip: awards/mip.csv
    all_league_teams: awards/all_league_teams.csv
    all_defense_teams: awards/all_defense_teams.csv
    all_rookie_teams: awards/all_rookie_teams.csv
  
  player_stats:
    clutch: player_stats/clutch
    adv_boxscores: player_stats/adv_boxscores
    boxscores: player_stats/boxscores
    general: player_stats/general
    playtype: player_stats/playtype
    shooting: player_stats/shooting
    shot_dashboard: player_stats/shot_dashboard
    defense_dashboard: player_stats/defense_dashboard

  team_stats:
    clutch: team_stats/clutch
    adv_boxscores: team_stats/adv_boxscores
    boxscores: team_stats/boxscores
    general: team_stats/general
    playtype: team_stats/playtype
    shooting: team_stats/shooting
    shot_dashboard: team_stats/shot_dashboard
    defense_dashboard: team_stats/defense_dashboard
    opponent_shooting: team_stats/opponent_shooting



processed_subdirs:
  players_bios_cleaned: players_bios_cleaned.csv
  team_bios_cleaned: team_bios_cleaned.csv
  mvp_cleaned: mvp_cleaned.csv

# Scraping configuration (no API key required)
api:
  nba_scraper:
    user_agent: ${NBA_USER_AGENT}
    common_all_players: "https://stats.nba.com/stats/commonallplayers?IsOnlyCurrentSeason=0&LeagueID=00&Season={season}"
    common_player_info: "https://stats.nba.com/stats/commonplayerinfo?PlayerID={player_id}"
    team_game_logs: "https://stats.nba.com/stats/teamgamelogs?TeamID={team_id}&Season={season}&SeasonType={season_type}"
    player_game_logs: "https://stats.nba.com/stats/playergamelogs?PlayerID={player_id}&Season={season}&SeasonType={season_type}"
    league_dash_player_clutch: "https://stats.nba.com/stats/leaguedashplayerclutch?Season={season}&SeasonType={season_type}"
    league_dash_team_clutch: "https://stats.nba.com/stats/leaguedashteamclutch?Season={season}&SeasonType={season_type}"
    league_dash_pt_team_defend: "https://stats.nba.com/stats/leaguedashptteamdefend?Season={season}&SeasonType={season_type}"
    league_dash_team_stats: "https://stats.nba.com/stats/leaguedashteamstats?Season={season}&SeasonType={season_type}"
    league_dash_opp_pt_shot: "https://stats.nba.com/stats/leaguedashoppptshot?Season={season}&SeasonType={season_type}"
    headers:
      user_agent: "${NBA_USER_AGENT}"
      origin: "https://www.nba.com"
      referer: "https://www.nba.com"
      accept: "application/json, text/plain, */*"
      x_nba_stats_origin: stats
      x_nba_stats_token: true

# Logging configuration
logging:
  level: ${LOG_LEVEL}
  path: logs/pipeline.log

# MLflow tracking
mlflow:
  uri: http://localhost:5000
  experiment: nba_analysis

# Modeling / Experiment defaults
defaults:
  seed: 42
  n_splits: 5
  use_gpu: ${USE_GPU}
  n_jobs: -1
  silhouette_url: https://cdn.nba.com/headshots/nba/latest/1040x760/fallback.png
  missing_birthdate: 1980-01-01
  undrafted_code: UDF
  retiree_missing_core_threshold: 4
  free_agent_label: FA

# Pipelines (optional mapping of stage names to script files)
pipelines:
  clean_players: clean_player.py
  scrape_teams: scrape_nba_teams.py
  clean_mvp: clean_mvp.py
  # add more as needed